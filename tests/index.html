<!-- index.html -->
<!doctype html>
<html lang="en">
  <head>
    <title>Push Tester</title>
  </head>
  <body style="font-family: sans-serif; padding: 2rem">
    <h2>1. Generate Subscription</h2>
    <button id="btn" style="padding: 10px 20px; font-size: 16px">
      Get Subscription JSON
    </button>

    <h2>2. Copy this to Postman</h2>
    <pre
      id="output"
      style="
        background: #eee;
        padding: 10px;
        border-radius: 5px;
        min-height: 100px;
      "
    ></pre>

    <script>
      // ⚠️ PASTE YOUR VAPID_PUBLIC_KEY HERE FROM YOUR .ENV
      const VAPID_PUBLIC_KEY =
        "BKcwyArBaDA5KyMh_iB5y_gEl-ECG1RfXkXkhD-x6-rbfOy-jl-WjNeScMtN2YlIzGDw98_r1hG7s-QYPIVP6Ug";

      // Helper to convert the Base64 key into a format the browser accepts
      function urlBase64ToUint8Array(base64String) {
        const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
        const base64 = (base64String + padding)
          .replace(/\-/g, "+")
          .replace(/_/g, "/");
        const rawData = window.atob(base64);
        const outputArray = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; ++i) {
          outputArray[i] = rawData.charCodeAt(i);
        }
        return outputArray;
      }

      document.getElementById("btn").addEventListener("click", async () => {
        // Request permission from the user
        await Notification.requestPermission();

        // Register the service worker
        const register = await navigator.serviceWorker.register("sw.js");

        // Subscribe to the push service
        const subscription = await register.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
        });

        // Output the JSON
        document.getElementById("output").textContent = JSON.stringify(
          subscription,
          null,
          2,
        );
      });
    </script>
  </body>
</html>
