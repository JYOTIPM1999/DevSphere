<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Group Chat Tester</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
        max-width: 600px;
        margin: 0 auto;
      }
      .box {
        border: 1px solid #ccc;
        padding: 15px;
        margin-bottom: 15px;
        border-radius: 5px;
      }
      #chat-window {
        height: 300px;
        border: 1px solid #000;
        overflow-y: auto;
        padding: 10px;
        margin-bottom: 5px;
        background: #f9f9f9;
      }
      .msg {
        margin-bottom: 8px;
        padding: 8px;
        background: #e1f5fe;
        border-radius: 4px;
      }
      .system {
        color: #888;
        font-size: 0.9em;
        font-style: italic;
      }
      input {
        width: 100%;
        padding: 8px;
        margin-bottom: 10px;
        box-sizing: border-box;
      }
      button {
        padding: 10px 15px;
        cursor: pointer;
        margin-right: 5px;
      }
      #typing-indicator {
        color: green;
        font-size: 0.9em;
        height: 20px;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <h2>Group & Room Tester</h2>

    <div class="box">
      <h3>1. Connect</h3>
      <input type="text" id="token" placeholder="Paste Access Token here" />
      <button onclick="connectSocket()">Connect Server</button>
      <span id="status" style="color: red">Offline</span>
    </div>

    <div class="box">
      <h3>2. Join Room</h3>
      <input
        type="text"
        id="conversationId"
        placeholder="Paste Conversation ID from Postman"
      />
      <button onclick="joinRoom()">Join Room</button>
      <button onclick="markAsRead()">Simulate 'Mark as Read'</button>
    </div>

    <div class="box">
      <h3>3. Chat</h3>
      <div id="chat-window"></div>
      <div id="typing-indicator"></div>
      <input
        type="text"
        id="message"
        placeholder="Type a message..."
        oninput="handleTyping()"
      />
      <button onclick="sendMessage()">Send to Room</button>
    </div>

    <script>
      let socket;
      let typingTimeout;
      let currentRoomId = "";

      function connectSocket() {
        const token = document.getElementById("token").value;
        socket = io("http://localhost:3000", { auth: { token } });

        socket.on("connect", () => {
          document.getElementById("status").innerText = "Online";
          document.getElementById("status").style.color = "green";
        });

        // Receive Group Message
        socket.on("receive_message", (msg) => {
          appendMessage(
            msg.sender === socket.id
              ? "You"
              : `User ${msg.sender.substring(0, 5)}...`,
            msg.content,
          );
        });

        // Typing Indicators
        socket.on("typing_start", (data) => {
          document.getElementById("typing-indicator").innerText =
            `User ${data.userId.substring(0, 5)} is typing...`;
        });
        socket.on("typing_stop", () => {
          document.getElementById("typing-indicator").innerText = "";
        });

        // Read Receipts
        socket.on("receipt_updated", (data) => {
          appendMessage(
            "System",
            `User ${data.userId.substring(0, 5)} read messages up to ${new Date(data.lastRead).toLocaleTimeString()}`,
            "system",
          );
        });
      }

      async function joinRoom() {
        // 1. Leave current room if in one
        if (currentRoomId) socket.emit("leave_room", currentRoomId);

        currentRoomId = document.getElementById("conversationId").value;
        const token = document.getElementById("token").value;

        // 2. Join the new live socket room
        socket.emit("join_room", currentRoomId);

        // Clear the UI window
        document.getElementById("chat-window").innerHTML = "";
        appendMessage("System", `Joined room: ${currentRoomId}`, "system");
        appendMessage("System", "Loading history...", "system");

        // 3. Fetch Message History via REST
        try {
          const response = await fetch(
            `http://localhost:3000/api/messages/${currentRoomId}`,
            {
              method: "GET",
              headers: {
                Authorization: `Bearer ${token}`, // Pass the JWT for the protected route
              },
            },
          );

          const result = await response.json();

          if (result.success) {
            document.getElementById("chat-window").innerHTML = ""; // Clear loading text
            appendMessage("System", `Joined room: ${currentRoomId}`, "system");

            // Loop through the database messages and put them on screen
            result.data.forEach((msg) => {
              // Since we used .populate('sender', 'name') in the backend, msg.sender is an object
              const senderName = msg.sender.name || "Unknown";
              appendMessage(senderName, msg.content);
            });

            appendMessage(
              "System",
              "--- End of History. Live chat below ---",
              "system",
            );
          } else {
            appendMessage("Error", result.error, "system");
          }
        } catch (error) {
          appendMessage("Error", "Failed to fetch history", "system");
        }
      }

      function sendMessage() {
        const content = document.getElementById("message").value;
        socket.emit("send_message", { conversationId: currentRoomId, content });
        document.getElementById("message").value = "";
        socket.emit("typing_stop", currentRoomId); // Stop typing immediately on send
      }

      function markAsRead() {
        socket.emit("message_read", currentRoomId);
        appendMessage("System", "You marked this room as read.", "system");
      }

      function handleTyping() {
        socket.emit("typing_start", currentRoomId);
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
          socket.emit("typing_stop", currentRoomId);
        }, 2000); // Stop typing if no keystroke for 2 seconds
      }

      function appendMessage(sender, text, cssClass = "msg") {
        const div = document.createElement("div");
        div.className = cssClass;
        div.innerHTML = `<strong>${sender}:</strong> ${text}`;
        document.getElementById("chat-window").appendChild(div);
      }
    </script>
  </body>
</html>
